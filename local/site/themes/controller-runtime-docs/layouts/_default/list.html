{{ define "main" }}
<article class="doc-content">
    <header class="doc-header">
        <h1>{{ .Title }}</h1>
    </header>
    
    <div class="doc-body">
        {{ .Content }}
        
        {{ if .Pages }}
        <section class="page-list">
            <h2>Contents</h2>
            <ul>
            {{ range .Pages.ByWeight }}
                <li>
                    <a href="{{ .Permalink }}">{{ .Title }}</a>
                    {{ with .Description }}
                    <p>{{ . }}</p>
                    {{ end }}
                </li>
            {{ end }}
            </ul>
        </section>
        {{ end }}
    </div>
</article>
{{ end }}
