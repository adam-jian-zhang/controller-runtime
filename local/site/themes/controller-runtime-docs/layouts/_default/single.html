{{ define "main" }}
<article class="doc-content">
    <header class="doc-header">
        <h1>{{ .Title }}</h1>
    </header>
    
    <div class="doc-body">
        {{ .Content }}
    </div>
    
    <footer class="doc-footer">
        {{ with .PrevInSection }}
        <a href="{{ .Permalink }}" class="doc-nav-link prev">
            ← {{ .Title }}
        </a>
        {{ end }}
        
        {{ with .NextInSection }}
        <a href="{{ .Permalink }}" class="doc-nav-link next">
            {{ .Title }} →
        </a>
        {{ end }}
    </footer>
</article>
{{ end }}
